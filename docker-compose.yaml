services:
  mysql:
    image: "mysql:8-oracle"
    ports:
      - 3307:3306

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: api_health_aggregator
      MYSQL_USER: api_health_aggregator
      MYSQL_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - "./db-setup/init.sql:/docker-entrypoint-initdb.d/1.sql"
